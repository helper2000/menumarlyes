<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنويه - سداد الاشتراك</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif, Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    .admin-banner {
      direction: rtl;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: calc(100% - 40px);
      max-width: 920px;
      background: linear-gradient(90deg,#b71c1c,#d32f2f);
      color: #fff;
      border: 2px solid #ffd700;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      font-family: 'Cairo', sans-serif, Arial, sans-serif;
    }
    .admin-banner .msg {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .admin-banner .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .admin-banner .btn {
      background: #ffd700;
      color: #b71c1c;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255,215,0,0.2);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .admin-banner .btn:active { transform: translateY(1px); }
    .admin-banner .btn.secondary {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.5);
      font-weight: 600;
    }
    .admin-banner .dismiss {
      background: transparent;
      color: rgba(255,255,255,0.9);
      font-size: 18px;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
    }
    @media (max-width:600px) {
      .admin-banner { flex-direction: column; align-items: stretch; gap:10px; padding: 10px; top: 8px; }
      .admin-banner .msg { font-size: 15px; text-align: center; }
      .admin-banner .actions { justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div id="adminBanner" class="admin-banner" role="status" aria-live="polite">
    <div class="msg">برجاء مراجعة الإدارة وسداد الاشتراك للحفاظ على استمرار الخدمات المقدمة لكم.</div>

    <div class="actions">
      <!-- غيّر الروابط حسب احتياجاتك -->
      <a id="contactAdminBtn" class="btn" href="akmh553@gmail.com?subject=مراجعة%20وسداد%20الاشتراك" target="_blank" rel="noopener">راجع الإدارة</a>
      <a id="payBtn" class="btn" href="https://wa.me/01009108218?text=مرحبًا%20أريد%20سداد%20الاشتراك" target="_blank" rel="noopener">سداد الاشتراك</a>
      <button id="laterBtn" class="btn secondary" aria-label="إغلاق مؤقت">لاحقًا</button>
      <button id="dismissBtn" class="dismiss" title="إخفاء نهائي" aria-label="إخفاء نهائي">✕</button>
    </div>
  </div>

  <script>
    (function() {
      const banner = document.getElementById('adminBanner');
      const dismiss = document.getElementById('dismissBtn');
      const later = document.getElementById('laterBtn');
      const storageKey = 'admin_banner_hidden_until';

      function shouldHide() {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return false;
        try {
          const data = JSON.parse(raw);
          if (data.type === 'permanent') return true;
          if (data.type === 'until' && Date.now() < data.until) return true;
          return false;
        } catch(e) { return false; }
      }

      if (shouldHide()) {
        banner.style.display = 'none';
      }

      dismiss.addEventListener('click', function() {
        localStorage.setItem(storageKey, JSON.stringify({ type: 'permanent' }));
        banner.style.display = 'none';
      });

      later.addEventListener('click', function() {
        const hours = 24; // مدة الإخفاء المؤقت (بالساعات)
        const until = Date.now() + hours * 60 * 60 * 1000;
        localStorage.setItem(storageKey, JSON.stringify({ type: 'until', until }));
        banner.style.display = 'none';
      });
    })();
  </script>

</body>
</html>
