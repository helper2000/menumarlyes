<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graines and Greens</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/4b6c81a3f2.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #004d40, #00251a);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    .logo img {
      width: 160px;
      margin: 20px 0;
    }
    h1 {
      font-size: 28px;
      color: #ffd700;
      margin-bottom: 10px;
    }
    .links {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .link-btn {
      background: #004d40;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 12px;
      border: 2px solid #ffd700;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .link-btn i {
      margin-right: 10px;
    }
    .link-btn:hover {
      background: #ffd700;
      color: #004d40;
    }
    .whatsapp {
      background: #25d366;
      color: white;
      font-size: 20px;
    }
    .menu {
      background: #8e44ad;
    }
    .countdown {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
    }
    footer {
      margin-top: auto;
      font-size: 14px;
      color: #aaa;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="https://i.ibb.co/pJ3V1vg/marleys-logo-gold.png" alt="Graines and Greens Logo">
  </div>
  <h1>Graines and Greens</h1>

  <div class="links">
    <a href="gngmenu.pdf" class="link-btn menu" target="_blank">
      <i class="fas fa-utensils"></i> View Menu
    </a>
    <a href="https://wa.me/201111175640" class="link-btn whatsapp" target="_blank">
      <i class="fab fa-whatsapp"></i> WhatsApp
    </a>
    <a href="https://facebook.com/" class="link-btn" target="_blank">
      <i class="fab fa-facebook"></i> Facebook
    </a>
    <a href="https://instagram.com/" class="link-btn" target="_blank">
      <i class="fab fa-instagram"></i> Instagram
    </a>
    <a href="https://tiktok.com/" class="link-btn" target="_blank">
      <i class="fab fa-tiktok"></i> TikTok
    </a>
  </div>

  <div class="countdown" id="countdown"></div>

  <footer>© 2025 Graines and Greens</footer>

  <script>
    // عداد تنازلي 30 يوم من دلوقتي
    const countdownElement = document.getElementById("countdown");
    const endDate = new Date();
    endDate.setDate(endDate.getDate() + 30);

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = endDate - now;

      if (distance < 0) {
        countdownElement.innerHTML = "The offer has ended!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.innerHTML = `Offer ends in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
